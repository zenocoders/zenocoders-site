# zenocoders.com — serveur statique derrière le proxy Caddy (réseau docker « web »).
# Aucun traitement côté serveur : pas de PHP, pas de formulaire, pas de base de données.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 1k;      # le site n'accepte aucun envoi de données

    # Un site statique n'a besoin que de GET et HEAD : tout le reste est refusé.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    include /etc/nginx/conf.d/security-headers.inc;

    # Fichiers cachés (.git, .env…) : jamais servis.
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
